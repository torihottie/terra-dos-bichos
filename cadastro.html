<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terra dos Bichos - Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Terra dos Bichos</h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section id="cadastro">
      <h2>Cadastro de Voluntário</h2>
      <p>Preencha o formulário abaixo para fazer parte da nossa rede de voluntários.</p>

      <form id="formCadastro">

        <fieldset class="dados-pessoais">
          <legend>Dados Pessoais</legend>

          <label for="nome">Nome completo:</label>
          <input type="text" id="nome" name="nome" required>

          <label for="nascimento">Data de nascimento:</label>
          <input type="date" id="nascimento" name="nascimento" required>

          <label for="cpf">CPF:</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14"
                 pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato esperado: 000.000.000-00" required>
        </fieldset>

        <fieldset class="contato">
          <legend>Contato</legend>

          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required>

          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15"
                 pattern="\(\d{2}\) \d{4,5}-\d{4}" title="Formato esperado: (00) 00000-0000" required>
        </fieldset>

        <fieldset class="endereco">
          <legend>Endereço</legend>

          <label for="cep">CEP:</label>
          <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9"
                 pattern="\d{5}-\d{3}" title="Formato esperado: 00000-000" required>

          <label for="endereco">Endereço:</label>
          <input type="text" id="endereco" name="endereco" required>

          <label for="cidade">Cidade:</label>
          <input type="text" id="cidade" name="cidade" required>

          <label for="estado">Estado:</label>
          <select id="estado" name="estado" required>
            <option value="">Selecione</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
            <option value="PR">Paraná</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="outros">Outro</option>
          </select>
        </fieldset>

        <button type="submit">Enviar Cadastro</button>
      </form>

      <p id="mensagem"></p>
    </section>

  </main>

  <footer>
    <p>Terra dos Bichos</p>
  </footer>

</body>
</html>
